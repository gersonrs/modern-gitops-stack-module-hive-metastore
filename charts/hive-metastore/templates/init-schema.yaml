apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hive-metastore.fullname" . }}-db-init-schema
spec:
  template:
    spec:
      {{- if .Values.jdbcOverride.enabled }}
      initContainers:
        - name: jdbc-override
          image: {{ .Values.jdbcOverride.image }}
          command: ["sh", "-c"]
          args:
            - curl -fsSL -o /jdbc/postgresql.jar "{{ .Values.jdbcOverride.jarUrl }}"
          volumeMounts:
            - name: jdbc-override
              mountPath: /jdbc
      {{- end }}
      containers:
      - name: hivemeta
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        command: ["/bin/sh", "-c"]
        args:
          - schematool
           --verbose
           -initSchema
           -ifNotExists
           -dbType postgres
           -userName "{{- .Values.connections.database.username }}"
           -passWord "$DATABASE_PASSWORD"
           -url "jdbc:postgresql://{{- tpl .Values.connections.database.host . }}:{{- .Values.connections.database.port }}/{{- .Values.connections.database.database }}"
        volumeMounts:
        - name: hive-config
          mountPath: /opt/hive-metastore/conf
        {{- if .Values.jdbcOverride.enabled }}
        - name: jdbc-override
          mountPath: {{ .Values.jdbcOverride.bundledJar }}
          subPath: postgresql.jar
        {{- end }}
        env:
          {{- if .Values.extraEnvVars }}
          {{- .Values.extraEnvVars | nindent 12 }}
          {{- end }}
          {{- if .Values.connections.database.password }}
          - name: DATABASE_PASSWORD
            value: "{{- .Values.connections.database.password }}"
          {{- end }}
        {{- if .Values.extraEnvVarsSecret }}
        envFrom:
          {{- if .Values.extraEnvVarsSecret }}
          - secretRef:
              name: "{{- .Values.extraEnvVarsSecret }}"
          {{- end }}
        {{- end }}
      volumes:
      - name: hive-config
        configMap:
          name: {{ include "hive-metastore.fullname" . }}
      {{- if .Values.jdbcOverride.enabled }}
      - name: jdbc-override
        emptyDir: {}
      {{- end }}


      restartPolicy: Never
  backoffLimit: 3
